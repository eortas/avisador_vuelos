name: Comprobar precios de vuelos

on:
  workflow_dispatch:
    inputs:
      force_notify:
        description: Enviar el estado actual aunque no haya cambios
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: flight-price-check
  cancel-in-progress: false

jobs:
  check-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ORIGIN: KRK
      DESTINATION: BIO
      DEPARTURE_MIN_DAYS: "30"
      DEPARTURE_MAX_DAYS: "60"
      MAX_STOPS: "1"
      CURRENCY: EUR
      ALERT_PERCENT: "8"
      TREND_HOURS: "72"
      TREND_POINTS: "3"
      REQUEST_DELAY_SECONDS: "2"
      MAX_DATES: "31"
      DATABASE_PATH: data/one-way-prices.db
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Validar secretos de Telegram
        shell: bash
        run: |
          if [[ -z "$TELEGRAM_BOT_TOKEN" || -z "$TELEGRAM_CHAT_ID" ]]; then
            echo "::error::Faltan TELEGRAM_BOT_TOKEN o TELEGRAM_CHAT_ID en los secretos del repositorio"
            exit 1
          fi

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Recuperar historico
        uses: actions/cache@v4
        with:
          path: data
          key: flight-prices-${{ github.run_id }}
          restore-keys: |
            flight-prices-

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Consultar precios
        shell: bash
        run: |
          if [[ "${{ inputs.force_notify }}" == "true" ]]; then
            python flight_tracker.py --force-notify
          else
            python flight_tracker.py
          fi
